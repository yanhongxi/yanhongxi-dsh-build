name: Build deepseek-harness

on:
  workflow_dispatch: # ✅ 手动点击按钮触发（重点）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ shturl.cc/Ij }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context, clone upstream deepseek-harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git ./src
          # 构建补丁：让web监听0.0.0.0
          cat > ./docker-patch.yml <<'EOF'
          - id: webserver
            config:
              host: '0.0.0.0'
              port: 3080
          EOF

      - name: Build and push multi‑arch image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepseek-harness:latest
